<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        table,th,td{
            border: 1px solid;
        }
        table{
            width: 30%;
            height: 550px;
            background-color: red;
            padding: 2px;
            margin-top: 100px;
        }
        td{
            text-align: center;
            border-radius: 5px;
        }
        th{
            height: 50px;
        }
        .symbol{

            background-color: yellow;
        }
        .numbers{
            background-color: azure;
        }
        .answer{
            text-align: right;
            padding-right: 10px;
            border-radius: 5px;

        }
    </style>
</head>
<body>
    <center>
    <table>
        <h1> CALCULATOR </h1>
        <tr>
            <th colspan="4" class = "numbers answer"> <h1> 5 + 5   = <br> 10
             </h1> </th>
            

        </tr>
       
         <tr>
             <td class = "symbol" style = "width: 90px;">(</td>
             <td class = "symbol">)</td>
              <td class = "symbol">%</td>
               <td class = "symbol">/</td>
        </tr>
         <tr>
            <td class = "numbers">7</td>
             <td class = "numbers">8</td>
              <td class = "numbers">9</td>
               <td class = "symbol">X</td>
        </tr>
         <tr>
            <td class = "numbers">4</td>
             <td class = "numbers">5</td>
              <td class = "numbers">6</td>
               <td class = "symbol">-</td>
    
        </tr>
         </tr>
         <tr>
            <td class = "numbers">1</td>
             <td class = "numbers">2</td>
              <td class = "numbers">3</td>
               <td rowspan="2" class = "symbol"> +</td>
        </tr>
         <tr>
            <td style="background-color: dodgerblue;">DEL</td>
             <td class = "numbers">0</td>
              <td style = "background-color: forestgreen;">=</td>
               
        </tr>
    </table>
    </center>
    
</body>
</html>
